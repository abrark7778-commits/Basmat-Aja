<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بصمة أجا</title>
<meta name="description" content="دليل حائل الصوتي الذكي — يتعرف على موقعك ويحكي لك قصة كل معلم عند اقترابك منه">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B8462B">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بصمة أجا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --sand:#FBF2EB; --sand2:#F3E6DA; --line:#E7D5C4; --ink:#3A1B13; --ink2:#7C5D50;
  --rust:#B8462B; --brown:#6B2A1C; --teal:#1F84A0; --tealbg:#DCEEF3; --ok:#2F8F62;
  --night:#1A0D09; --night2:#2B1510; --glow:#F2A66B;
  --f-body:'Readex Pro','Segoe UI',Tahoma,sans-serif;
  --f-disp:'Reem Kufi','Readex Pro',Tahoma,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}

/* ---------- app shell ---------- */
#app{position:relative;height:100vh;height:100dvh;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--sand);overflow:hidden;isolation:isolate}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.view::-webkit-scrollbar{display:none}
.pane{display:none;padding:14px 18px 24px}
.pane.on{display:block;animation:fade .35s ease}
.pane.map.on{display:block;padding:0;height:100%}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(251,242,235,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);position:relative;z-index:8}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:#A48878;font-size:11px;padding:6px 0;border-radius:14px;transition:color .2s}
.tab.on{color:var(--rust);font-weight:600}
.tab .ic{width:23px;height:23px}

/* ---------- home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top .brand{display:flex;align-items:center;gap:10px}
.top img{width:44px;height:44px;border-radius:12px;background:var(--sand);object-fit:cover}
.top .t1{font-family:var(--f-disp);font-weight:700;font-size:20px;line-height:1.1}
.top .t2{font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.gps{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(47,143,98,.5);animation:ping 2s infinite}
.gps.off{background:#C9A98F;animation:none}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sand2);color:var(--ink2);flex:none}
.top .tb{display:flex;gap:8px;align-items:center}
.hero{position:relative;border-radius:26px;overflow:hidden;height:230px;color:#fff;isolation:isolate}
.hero>svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;transform:scaleX(-1)}
#app[dir=ltr] .hero>svg{transform:none}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,14,8,0) 25%,rgba(40,14,8,.78) 100%);z-index:-1}
.hero .in{position:absolute;inset:auto 0 0 0;padding:18px;display:flex;flex-direction:column;gap:10px}
.hero h2{text-shadow:0 2px 14px rgba(40,14,8,.55);margin:0;font-family:var(--f-disp);font-size:27px;line-height:1.15;font-weight:700;text-wrap:balance}
.hero p{margin:0;font-size:12.5px;color:#F6DFCC}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:14px;background:var(--rust);color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 20px -8px rgba(184,70,43,.8);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);box-shadow:none}
.btn.soft{background:var(--sand2);color:var(--brown);box-shadow:none}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:12px}
.hero .btn{align-self:flex-start}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec h3{margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600}
.sec small{color:var(--ink2);font-size:11.5px}
.sec button{color:var(--rust);font-size:12.5px;font-weight:500}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 11px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:center;transition:transform .15s,box-shadow .15s}
.cat:active{transform:scale(.97)}
.cat .c{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cat .c .ic{width:24px;height:24px}
.cat b{font-size:12.5px;font-weight:600;line-height:1.25}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:start;width:100%}
.row .th{width:62px;height:62px;border-radius:14px;overflow:hidden;flex:none;position:relative}
.row .th svg{width:100%;height:100%;display:block}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.row .tx span{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:11.5px;margin-top:3px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:500;color:#fff}
.pill.mut{background:var(--sand2);color:var(--ink2)}
.row .tx .pill,.row .tx span .pill{color:#fff!important}
.row .tx .pill.mut{color:var(--ink2)!important}
.round{width:40px;height:40px;border-radius:50%;background:var(--rust);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -6px rgba(184,70,43,.9)}
.round.off{background:var(--sand2);color:#B49A8B;box-shadow:none}
.round.ok{background:var(--ok)}
.mini-fp{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:linear-gradient(135deg,#6B2A1C,#3A150E);color:#fff;text-align:start;width:100%}
.mini-fp svg{width:64px;height:76px;flex:none}
.mini-fp b{display:block;font-family:var(--f-disp);font-size:17px}
.mini-fp span{font-size:12px;color:#E9CDB9}

/* ---------- sponsors (placeholder strip) ---------- */
.sponsors{margin-top:22px}
.sponsors .strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.sponsors .strip::-webkit-scrollbar{display:none}
.sp-card{flex:none;width:108px;height:66px;border-radius:14px;background:#fff;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#B49A83}
.sp-card .ic{width:20px;height:20px}
.sp-card b{font-size:11px;font-weight:600;color:var(--ink2)}
.sponsors .note{font-size:11px;color:var(--ink2);margin-top:8px;line-height:1.5}

/* ---------- map / radar ---------- */
.mapwrap{position:relative;height:100%;background:#EFE2D2;overflow:hidden;display:flex;flex-direction:column}
.mapwrap>svg{width:100%;flex:1;min-height:0}
.pin{cursor:pointer}
.pin .halo{fill:none;stroke-width:1.4;stroke-dasharray:3 3;opacity:.7}
.pin.hit .halo{animation:halo 1.8s ease-out infinite}
.me-ring{animation:mering 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.mtop{position:absolute;inset:8px 14px auto 14px;display:flex;gap:8px;z-index:4}
.mtop .card{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(255,250,245,.94);backdrop-filter:blur(10px);box-shadow:0 10px 26px -14px rgba(60,20,10,.55)}
.mtop .card b{display:block;font-size:13px;line-height:1.3}
.mtop .card span{font-size:11px;color:var(--ink2)}
.mfab{position:absolute;inset-inline:14px;bottom:14px;z-index:4;display:flex;gap:10px;align-items:stretch}
.mfab .btn{flex:1}
.mnolo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:var(--ink2)}
.mnolo svg{width:56px;height:56px;color:var(--ink2)}

/* ---------- explore ---------- */
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:15px;background:#fff;border:1px solid var(--line);color:var(--ink2);margin-bottom:12px}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);min-width:0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.chip i{width:8px;height:8px;border-radius:50%}
.empty{padding:26px 10px;text-align:center;color:var(--ink2)}

/* ---------- fingerprint ---------- */
.fp-head{text-align:center;padding-top:4px}
.fp-head h2{margin:0;font-family:var(--f-disp);font-size:26px}
.fp-head p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.fp-art{position:relative;margin:10px auto 6px;width:236px;height:290px}
.fp-art svg{width:100%;height:100%;overflow:visible}
.fp-art .glow{position:absolute;inset:20% 10%;border-radius:50%;background:radial-gradient(circle,rgba(184,70,43,.28),transparent 68%);filter:blur(16px);transition:opacity .6s}
.ridge{fill:none;stroke-linecap:round;stroke-width:3.2;transition:stroke .5s,opacity .5s}
.ridge.off{stroke:#DCC7B4;opacity:.75}
.ridge.on{stroke:var(--rust)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.stat{padding:12px 6px;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:center}
.stat b{display:block;font-family:var(--f-disp);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink2)}

/* ---------- overlays ---------- */
.ovl{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--sand);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.ovl.on{transform:none;visibility:visible}
.sheetbg{position:absolute;inset:0;z-index:30;background:rgba(30,10,5,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:35;max-height:88%;overflow:auto;background:var(--sand);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.sheet.on{transform:none}
.sheet::-webkit-scrollbar{display:none}
.sh-scene{height:190px;position:relative}
.sh-scene svg{width:100%;height:100%;display:block}
.sh-body{padding:16px 20px 26px;display:grid;gap:12px}
.sh-body h2{margin:0;font-family:var(--f-disp);font-size:26px;line-height:1.15}
.sh-body p{margin:0;color:#5A3A2E;line-height:1.75}
.tagline{color:var(--ink2);font-size:12.5px;margin-top:2px}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.facts span{padding:4px 10px;border-radius:99px;background:var(--sand2);font-size:12px;color:var(--brown)}
.x{position:absolute;top:12px;inset-inline-start:14px;z-index:4;width:38px;height:38px;border-radius:50%;background:rgba(30,10,5,.45);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center}
.about{padding:20px;display:flex;flex-direction:column;gap:16px;color:var(--ink)}
.about h1{margin:0;font-family:var(--f-disp);font-size:26px}
.about h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--rust);font-weight:600}
.about p{margin:0;line-height:1.75;color:#5A3A2E}
.about ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.about ol li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.about ol li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--sand2);color:var(--rust);display:grid;place-items:center;font-size:12px;font-weight:600}
.about .chips2{display:flex;flex-wrap:wrap;gap:8px}
.about .chips2 span{padding:5px 12px;border-radius:99px;background:var(--sand2);font-size:12.5px;color:var(--brown)}

/* ---------- language sheet ---------- */
.langrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:15px;font-weight:600;margin-bottom:8px}
.langrow.on{background:var(--rust);color:#fff;border-color:var(--rust)}
.langrow small{font-weight:400;font-size:12px;opacity:.8}

/* ---------- player ---------- */
.pl-scene{position:relative;height:240px;flex:none;overflow:hidden;background:#F4B78D}
.pl-scene svg{position:absolute;inset:-4% -6%;width:112%;height:108%;animation:drift 18s ease-in-out infinite alternate;animation-play-state:paused}
.playing .pl-scene svg{animation-play-state:running}
.pl-scene::after{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:linear-gradient(180deg,transparent,var(--sand))}
.ai-badge{position:absolute;top:14px;inset-inline-end:14px;z-index:3;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:rgba(30,10,5,.5);backdrop-filter:blur(8px);color:#fff;font-size:11.5px}
.ai-badge .ic{width:15px;height:15px}
.pl-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px calc(16px + env(safe-area-inset-bottom,0px));margin-top:-46px;position:relative;z-index:2}
.pl-meta{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.pl-body h2{margin:0;font-family:var(--f-disp);font-size:28px;line-height:1.15}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:38px;margin:12px 0 8px}
.bar{width:3.5px;border-radius:3px;background:linear-gradient(180deg,var(--rust),#E58B5A);height:var(--h);opacity:.5;transform:scaleY(.45);transition:opacity .3s}
.playing .bar{opacity:1;animation:bounce .9s ease-in-out infinite alternate;animation-delay:var(--d)}
.lines{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:6px 0 26px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent)}
.lines::-webkit-scrollbar{display:none}
.ln{margin:0 0 12px;font-size:17px;line-height:1.85;color:#BFA596;transition:color .3s;font-weight:400}
.ln.done{color:#8A6A5C}
.ln.on{color:var(--ink);font-weight:500}
.ln.rtl{direction:rtl;text-align:right}
.ln.ltr{direction:ltr;text-align:left;font-size:15.5px}
.ln .w{transition:color .15s}
.ln.on .w{color:var(--ink)}
.ln.on .w.k{color:var(--rust)}
.prog{display:grid;gap:6px;margin-top:2px}
.track{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E58B5A,var(--rust));border-radius:5px}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ctl .cb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.ctl .cb.t{width:auto;min-width:46px;padding:0 10px;font-size:13px;font-weight:600;border-radius:23px;background:var(--sand2);color:var(--brown)}
.ctl .main{width:66px;height:66px;background:var(--rust);color:#fff;box-shadow:0 12px 26px -10px rgba(184,70,43,.9)}
.ctl .main .ic{width:28px;height:28px}
.hint{font-size:11.5px;color:var(--ink2);text-align:center;margin-top:8px;min-height:16px}
.done-card{visibility:hidden;position:absolute;inset-inline:16px;bottom:16px;z-index:6;padding:16px;border-radius:24px;background:linear-gradient(135deg,#6B2A1C,#3A150E);color:#fff;display:flex;gap:14px;align-items:center;transform:translateY(190%);transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 24px 40px -16px rgba(0,0,0,.6)}
.done-card.on{transform:none;visibility:visible}
.done-card svg{width:52px;height:62px;flex:none}
.done-card b{display:block;font-family:var(--f-disp);font-size:18px;line-height:1.25}
.done-card span{font-size:12px;color:#E9CDB9;display:block;margin-bottom:8px}
.done-card .btn{height:34px;font-size:12.5px;padding:0 14px;border-radius:11px}
.done-card .btn+.btn{background:rgba(255,255,255,.14);box-shadow:none;margin-inline-start:6px}

/* ---------- notifications ---------- */
.notif{position:absolute;top:14px;inset-inline:12px;z-index:70;display:flex;gap:12px;align-items:center;padding:12px;border-radius:22px;background:rgba(255,250,245,.97);box-shadow:0 20px 40px -14px rgba(50,15,8,.65);transform:translateY(-320%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.9,.25,1.15),visibility 0s .5s}
.notif.on{transform:none;visibility:visible;transition-delay:0s}
.notif .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.notif .tx{flex:1;min-width:0}
.notif b{display:block;font-size:13.5px;line-height:1.3}
.notif span{font-size:11.5px;color:var(--ink2)}
.toast{position:absolute;inset-inline:22px;bottom:92px;z-index:80;padding:11px 16px;border-radius:14px;background:#2A1510;color:#fff;font-size:12.5px;text-align:center;opacity:0;transform:translateY(10px);transition:.35s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* ---------- misc ---------- */
.seg{display:flex;background:var(--sand2);border-radius:12px;padding:3px;gap:2px;margin:8px 0}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:7px 4px;font:600 12px/1 inherit;font-family:inherit;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--rust);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.warnbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#FBE7D8;color:var(--brown);font-size:12px;margin-bottom:10px}

/* ---------- motion ---------- */
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(47,143,98,0)}100%{box-shadow:0 0 0 0 rgba(47,143,98,0)}}
@keyframes bounce{to{transform:scaleY(1)}}
@keyframes drift{from{transform:translateX(-2.5%) scale(1.02)}to{transform:translateX(2.5%) scale(1.06)}}
@keyframes halo{0%{r:16;opacity:.9}100%{r:44;opacity:0}}
@keyframes mering{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H10v-5.5h4v5.5h3.5a1 1 0 0 0 1-1V10"/></symbol>

    sub:{"ar": "أحد جبلي طيّئ، حاضر في الشعر والحكايات", "en": "One of the two mountains of Tayy, alive in poetry and tales", "fr": "L'une des deux montagnes de Tayy, présente dans la poésie et les récits", "ur": "طیء کے دو پہاڑوں میں سے ایک، شاعری اور کہانیوں میں زندہ", "hi": "तय्य के दो पहाड़ों में से एक, कविता और कहानियों में जीवित", "zh": "泰伊双山之一，活在诗歌与传说中"},
    fact:{"ar": "قمة بارتفاع 1550 متراً", "en": "Peak at 1,550 m", "fr": "Sommet à 1 550 m", "ur": "چوٹی کی بلندی 1550 میٹر", "hi": "शिखर की ऊँचाई 1550 मीटर", "zh": "山峰海拔1550米"},
    text:{"ar": ["أنت الآن أمام جبل أجا، الذي أخذت منه حائل اسمها وهويتها.", "يُعرف أجا مع جبل سلمى بجبلي طيّئ، وقد ذكرهما الشعراء العرب في قصائدهم منذ القدم.", "وارتبط هذان الجبلان بقبيلة طيّئ التي خرج منها حاتم الطائي، رمز الكرم عند العرب.", "تحكي الروايات القديمة قصة حب جمعت أجأ وسلمى، ومنها جاء اسما الجبلين.", "اليوم تستقبل قممه ومساراته محبي المشي والتصوير، وتمنحهم إطلالة على واحدة من أجمل مناظر الشمال."], "en": ["You are now facing Mount Aja, which gave Hail its name and its identity.", "Aja and Mount Salma are known as the two mountains of Tayy, and Arab poets have mentioned them in verse since ancient times.", "They are tied to the Tayy tribe, home of Hatim al-Tai, the Arab symbol of generosity.", "Old tales speak of a love story between Aja and Salma, and from it the two mountains took their names.", "Today its peaks and trails welcome hikers and photographers with a view of one of the finest landscapes in the north."], "fr": ["Vous voici devant le mont Aja, qui a donné à Hail son nom et son identité.", "Aja et le mont Salma sont connus comme les deux montagnes de Tayy, et les poètes arabes les ont mentionnées dans leurs vers depuis l'Antiquité.", "Ces deux montagnes sont liées à la tribu de Tayy, dont est issu Hatim al-Tai, symbole arabe de la générosité.", "D'anciens récits racontent une histoire d'amour entre Aja et Salma, d'où viennent les noms des deux montagnes.", "Aujourd'hui, ses sommets et ses sentiers accueillent les amateurs de randonnée et de photographie, leur offrant l'un des plus beaux panoramas du nord."], "ur": ["اب آپ جبلِ اجا کے سامنے کھڑے ہیں، جس کے نام سے حائل کو اپنا نام اور پہچان ملی۔", "اجا اور جبلِ سلمیٰ کو مل کر طیء کے دو پہاڑ کہا جاتا ہے، اور عرب شاعروں نے قدیم زمانے سے اپنی شاعری میں ان کا ذکر کیا ہے۔", "یہ دونوں پہاڑ قبیلہ طیء سے جڑے ہیں، جس سے تعلق رکھنے والے حاتم طائی عربوں کے ہاں سخاوت کی علامت ہیں۔", "پرانی روایات اجا اور سلمیٰ کے درمیان ایک محبت کی کہانی سناتی ہیں، جہاں سے دونوں پہاڑوں کے نام آئے۔", "آج اس کی چوٹیاں اور راستے واکنگ اور فوٹوگرافی کے شائقین کا استقبال کرتے ہیں، اور انہیں شمال کے خوبصورت ترین مناظر میں سے ایک دکھاتے ہیں۔"], "hi": ["अब आप जबल अजा के सामने खड़े हैं, जिसने हाइल को उसका नाम और पहचान दी।", "अजा और जबल सलमा को मिलाकर तय्य के दो पहाड़ कहा जाता है, और अरब कवियों ने प्राचीन काल से अपनी कविताओं में इनका उल्लेख किया है।", "ये दोनों पहाड़ तय्य क़बीले से जुड़े हैं, जिससे हातिम ताई का संबंध था, जो अरबों के बीच उदारता का प्रतीक माने जाते हैं।", "पुरानी कहानियाँ अजा और सलमा के बीच एक प्रेम कहानी सुनाती हैं, जहाँ से दोनों पहाड़ों के नाम आए।", "आज इसकी चोटियाँ और रास्ते पैदल यात्रियों और फ़ोटोग्राफ़ी के शौकीनों का स्वागत करते हैं, और उन्हें उत्तर के सबसे खूबसूरत नज़ारों में से एक दिखाते हैं।"], "zh": ["您现在面对的是阿贾山，哈伊勒的名字和身份正是源自于此。", "阿贾山与萨勒玛山合称为泰伊双山，自古以来阿拉伯诗人就在诗中提到过它们。", "这两座山与泰伊部落有关，慷慨的阿拉伯象征人物哈提姆·塔伊正是出自这个部落。", "古老的传说讲述了阿贾与萨勒玛之间的爱情故事，两座山的名字也由此而来。", "如今，这里的山峰与小径迎接着徒步和摄影爱好者，为他们呈现北部最美的风景之一。"]},

  { id:"jubbah", cat:'heritage', scene:"rock", lat:28.0106, lng:40.9131,
    name:{"ar": "جبة والنقوش الصخرية", "en": "Jubbah Rock Art", "fr": "Art rupestre de Jubbah", "ur": "جبہ اور چٹانی نقوش", "hi": "जुब्बा शैल कला", "zh": "杰巴岩画"},
    sub:{"ar": "متحف مفتوح لتاريخ الإنسانية", "en": "An open-air museum of human history", "fr": "Un musée à ciel ouvert de l'histoire humaine", "ur": "انسانی تاریخ کا کھلا عجائب گھر", "hi": "मानव इतिहास का खुला संग्रहालय", "zh": "人类历史的露天博物馆"},
    fact:{"ar": "مسجل بيونسكو منذ 2015", "en": "UNESCO listed since 2015", "fr": "Inscrit à l'UNESCO depuis 2015", "ur": "2015 سے یونیسکو کی فہرست میں", "hi": "2015 से यूनेस्को सूचीबद्ध", "zh": "自2015年列入联合国教科文组织名录"},
    text:{"ar": ["هنا في جبة، على بعد نحو تسعين كيلومتراً شمال غرب حائل، تقف أمام واحد من أقدم سجلات الإنسان على وجه الأرض.", "على جبل أم سنمان نقش الناس قبل آلاف السنين صور البشر والحيوانات بأدوات حجرية بسيطة.", "وكانت بالقرب من هذه الصخور بحيرة ماء عذب اختفت منذ زمن بعيد.", "وقد سُجل الفن الصخري في منطقة حائل ضمن قائمة اليونسكو للتراث العالمي عام ألفين وخمسة عشر.", "اقترب من الصخرة بهدوء وتأمل الخطوط، فهي رسائل تركها أناس عاشوا هنا قبل أن تُكتب الحروف.", "كل نقش هنا بصمة إنسان قديم، وأنت الآن تسمع حكايتها."], "en": ["Here in Jubbah, about ninety kilometres northwest of Hail, you stand before one of the oldest records of humankind.", "On Jabal Umm Sinman, people carved human and animal figures into the rock with simple stone tools thousands of years ago.", "Close to these rocks lay a freshwater lake that vanished long ago.", "The rock art of the Hail region has been on UNESCO's World Heritage List since 2015.", "Step closer quietly and study the lines, because they are messages left by people who lived here before letters were written.", "Every carving here is the fingerprint of an ancient person, and you are now hearing its story."], "fr": ["Ici, à Jubbah, à environ quatre-vingt-dix kilomètres au nord-ouest de Hail, vous vous trouvez devant l'un des plus anciens témoignages de l'humanité.", "Sur le mont Umm Sinman, des hommes ont gravé, il y a des milliers d'années, des figures humaines et animales avec de simples outils en pierre.", "Près de ces rochers se trouvait autrefois un lac d'eau douce, disparu depuis longtemps.", "L'art rupestre de la région de Hail est inscrit sur la liste du patrimoine mondial de l'UNESCO depuis 2015.", "Approchez-vous doucement du rocher et observez les traits, car ce sont des messages laissés par des gens qui vivaient ici avant même l'invention de l'écriture.", "Chaque gravure ici est l'empreinte d'un homme ancien, et vous entendez maintenant son histoire."], "ur": ["یہاں جبہ میں، حائل سے تقریباً نوے کلومیٹر شمال مغرب میں، آپ انسانیت کی قدیم ترین یادگاروں میں سے ایک کے سامنے کھڑے ہیں۔", "جبلِ ام سنمان پر ہزاروں سال پہلے لوگوں نے سادہ پتھر کے اوزاروں سے انسانوں اور جانوروں کی تصویریں کندہ کیں۔", "ان چٹانوں کے قریب کبھی میٹھے پانی کی ایک جھیل ہوا کرتی تھی جو مدتوں پہلے غائب ہو گئی۔", "حائل کے علاقے کے چٹانی فن کو 2015 سے یونیسکو کی عالمی ثقافتی ورثے کی فہرست میں شامل کیا گیا ہے۔", "چٹان کے قریب آہستگی سے جائیں اور ان لکیروں پر غور کریں، کیونکہ یہ ان لوگوں کے پیغامات ہیں جو یہاں حروف لکھے جانے سے پہلے بستے تھے۔", "یہاں کی ہر نقاشی ایک قدیم انسان کی نشانی ہے، اور اب آپ اس کی کہانی سن رہے ہیں۔"], "hi": ["यहाँ जुब्बा में, हाइल से लगभग नब्बे किलोमीटर उत्तर-पश्चिम में, आप मानवता के सबसे पुराने अभिलेखों में से एक के सामने खड़े हैं।", "जबल उम्म सिनमान पर हज़ारों साल पहले लोगों ने साधारण पत्थर के औज़ारों से इंसानों और जानवरों की तस्वीरें उकेरीं।", "इन चट्टानों के पास कभी मीठे पानी की एक झील हुआ करती थी जो बहुत समय पहले लुप्त हो गई।", "हाइल क्षेत्र की शैल कला 2015 से यूनेस्को की विश्व धरोहर सूची में शामिल है।", "चट्टान के पास धीरे से जाएँ और इन रेखाओं को ध्यान से देखें, क्योंकि ये उन लोगों के संदेश हैं जो यहाँ लिपि के आविष्कार से पहले रहते थे।", "यहाँ की हर नक़्क़ाशी एक प्राचीन इंसान की निशानी है, और अब आप उसकी कहानी सुन रहे हैं।"], "zh": ["在这里，杰巴，位于哈伊勒西北约九十公里处，您正站在人类最古老的记录之一面前。", "在乌姆辛曼山上，数千年前的人们用简单的石器在岩石上刻下了人类和动物的图案。", "这些岩石附近曾经有一片淡水湖，早已消失不见。", "哈伊勒地区的岩石艺术自2015年起被列入联合国教科文组织世界遗产名录。", "请轻轻靠近岩石，细细端详这些线条，它们是文字发明之前生活在这里的人们留下的信息。", "这里的每一处雕刻都是古人的印记，此刻您正在聆听它的故事。"]},

/* ---------- geolocation (real, accuracy-weighted) ---------- */
var TRIGGER_RADIUS_M=150, MAX_USABLE_ACCURACY_M=500, POS_BUFFER_MAX=6;
function toRad(d){return d*Math.PI/180;}
function toDeg(r){return r*180/Math.PI;}
function haversine(lat1,lng1,lat2,lng2){
  var R=6371000,dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function bearingTo(lat1,lng1,lat2,lng2){
  var y=Math.sin(toRad(lng2-lng1))*Math.cos(toRad(lat2));
  var x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lng2-lng1));
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function smoothedFix(lat,lng,acc){
  if(acc>MAX_USABLE_ACCURACY_M&&S.geo.buf.length)return; // ignore very poor fixes if we already have something
  S.geo.buf.push({lat:lat,lng:lng,acc:Math.max(5,acc)});
  if(S.geo.buf.length>POS_BUFFER_MAX)S.geo.buf.shift();
  var wsum=0,lat2=0,lng2=0;
  S.geo.buf.forEach(function(f){var w=1/(f.acc*f.acc);wsum+=w;lat2+=f.lat*w;lng2+=f.lng*w;});
  S.geo.lat=lat2/wsum;S.geo.lng=lng2/wsum;S.geo.acc=acc;
}
function onPosition(pos){
  smoothedFix(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy||50);
  S.geo.status='active';
  checkGeofence();
  if(S.tab==='map')renderTab('map');
  if(S.tab==='home')renderTab('home');
  refreshHeaderGps();
}
function onGeoError(err){
  if(S.geo.status!=='active'){S.geo.status='error';S.geo.errCode=err&&err.code;}
  refreshHeaderGps();
  if(S.tab==='map')renderTab('map');
}
function startGeo(){
  if(!('geolocation' in navigator)){S.geo.status='nogeo';if(S.tab==='map')renderTab('map');return;}
  S.geo.status='activating';refreshHeaderGps();if(S.tab==='map')renderTab('map');
  navigator.geolocation.getCurrentPosition(onPosition,onGeoError,{enableHighAccuracy:true,maximumAge:0,timeout:12000});
  if(S.geo.watchId==null){
    S.geo.watchId=navigator.geolocation.watchPosition(onPosition,onGeoError,{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
  }
}
function refreshHeaderGps(){
  var g=$('#gpsdot');if(!g)return;
  g.classList.toggle('off',S.geo.status!=='active');
}
var geoTrig={};
function checkGeofence(){
  if(S.geo.lat==null)return;
  STORY.forEach(function(p){
    var d=haversine(S.geo.lat,S.geo.lng,p.lat,p.lng);
    var radius=TRIGGER_RADIUS_M+Math.min(S.geo.acc||50,100);
    if(d<radius&&!geoTrig[p.id]){
      geoTrig[p.id]=1;
      showNotif(p);
    }
    if(d>radius*2.2)geoTrig[p.id]=0; // allow re-trigger after leaving
  });
}
function meters(p){if(S.geo.lat==null)return null;return haversine(S.geo.lat,S.geo.lng,p.lat,p.lng);}
function distTxt(p){
  var m=meters(p);
  if(m==null)return t('distEnableLocation');
  if(m<1000)return nf(Math.max(10,Math.round(m/10)*10))+(S.ui==='ar'?' م':' m');
  return nf((m/1000).toFixed(1).replace('.',dsep()))+(S.ui==='ar'?' كم':' km');
}
function fmt(s){s=Math.max(0,Math.round(s));return nf(Math.floor(s/60))+':'+nf(String(s%60).padStart(2,'0'));}
function toast(txt){var e=$('#toast');e.textContent=txt;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('on');},2600);}

/* ---------- fingerprint art ---------- */
function fpSVG(cls,groups){
  var per=2,total=STORY.length*per,o='<svg viewBox="-120 -150 240 300" class="'+(cls||'')+'" aria-hidden="true">';
  for(var j=0;j<total;j++){
    var g=Math.floor(j/per),on=groups?groups[g]:false;
    var rx=10+j*(98/total),ry=14+j*(128/total),gapC=(90+j*47)*Math.PI/180,gap=0.55+((j*37)%5)*0.06;
    var a0=gapC+gap/2,a1=gapC-gap/2+Math.PI*2;
    var x0=rx*Math.cos(a0),y0=ry*Math.sin(a0),x1=rx*Math.cos(a1),y1=ry*Math.sin(a1);
    o+='<path class="ridge '+(on?'on':'off')+'" style="stroke-width:2.5" d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+rx.toFixed(1)+' '+ry.toFixed(1)+' 0 1 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+'"/>';
  }
  return o+'<circle r="4.5" style="stroke-width:2.5" class="ridge '+(groups&&groups.some(function(x){return x;})?'on':'off')+'" fill="none"/></svg>';
}

/* ---------- map / radar ---------- */
function nearestStory(){
  var withD=STORY.filter(function(p){return meters(p)!=null;});
  if(!withD.length)return STORY[0];

}
var RADAR_RINGS=[ {d:1000,label:'1'+(S.ui==='ar'?' كم':' km')}, {d:10000,label:'10'}, {d:100000,label:'100'} ];
function scaleR(dMeters,maxR){
  var maxD=100000; // 100km outer edge
  var f=Math.sqrt(Math.min(1,dMeters/maxD));
  return 26+f*(maxR-26);
}
function rMap(){
  if(S.geo.status!=='active'){
    var msg;

  }
  var R=150,o='<div class="mapwrap"><svg viewBox="-170 -170 340 340" id="radarsvg">';

  [50,100,150].forEach(function(rr){o+='<circle r="'+rr+'" fill="none" stroke="#D9C2A8" stroke-width="1" stroke-dasharray="3 5"/>';});
  var ringLabels=['1'+(S.ui==='ar'?'كم':'km'),'10'+(S.ui==='ar'?'كم':'km'),'≥100'+(S.ui==='ar'?'كم':'km')];
  [50,100,150].forEach(function(rr,i){o+='<text x="4" y="'+(-rr+11)+'" font-size="9" fill="#B49A83" font-family="Readex Pro,Tahoma,sans-serif">'+ringLabels[i]+'</text>';});
  o+='<line x1="0" y1="-150" x2="0" y2="150" stroke="#E4CDB6" stroke-width="1"/><line x1="-150" y1="0" x2="150" y2="0" stroke="#E4CDB6" stroke-width="1"/>';
  o+='<text x="0" y="-136" text-anchor="middle" font-size="11" font-weight="700" fill="#8A6B5C" font-family="Readex Pro,Tahoma,sans-serif">N</text>';
  STORY.forEach(function(p){
    var d=meters(p),brg=bearingTo(S.geo.lat,S.geo.lng,p.lat,p.lng),rad=toRad(brg);
    var r=scaleR(d,150),x=r*Math.sin(rad),y=-r*Math.cos(rad);

    o+='<g class="pin '+(near?'hit':'')+'" data-act="open" data-v="'+p.id+'" transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')">';
    o+='<circle class="halo" r="26" stroke="'+c.color+'"/>';
    o+='<circle r="15" fill="#fff" opacity=".95"/><circle r="12.5" fill="'+c.color+'"/>';
    o+='<use href="#i-'+c.icon+'" x="-8" y="-8" width="16" height="16" stroke="#fff" fill="none" style="stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/>';
    if(done)o+='<circle cx="10" cy="-10" r="6" fill="#2F8F62" stroke="#fff" stroke-width="1.5"/><path d="m7.5 -10 2 2 3-3.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>';
    o+='<text y="30" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4A2419" stroke="#FBF2EB" stroke-width="3" paint-order="stroke" font-family="Readex Pro,Tahoma,sans-serif">'+pn(p)+'</text></g>';
  });
  o+='<g><circle class="me-ring" r="10" fill="#1F84A0" opacity=".35"/><circle r="8.5" fill="#fff"/><circle r="6" fill="#1F84A0"/></g>';
  o+='</svg>';

/* ---------- player ---------- */
var P={p:null,idx:0,playing:false,rate:1,tok:0,lineStart:0,durs:[],raf:0,timers:[],voice:null,real:false};
function loadVoices(){
  try{
    var v=window.speechSynthesis.getVoices()||[];
    var want=LANGS[S.ui].speech.split('-')[0];
    P.voice=v.filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf(want)===0;})[0]||null;
  }catch(e){}
}
try{loadVoices();window.speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){}
function clearTimers(){P.timers.forEach(clearTimeout);P.timers=[];try{window.speechSynthesis.cancel();}catch(e){}}
function narrLines(p){
  return p.text[S.ui]||p.text.ar;
}
function openPlayer(id){
  var p=byId(id);if(!p)return;
  closeSheet();hideNotif();
  P.p=p;P.idx=0;P.playing=false;
  loadVoices();
  buildPlayer();
  $('#player').classList.add('on');
  setTimeout(startPlay,380);
}
function buildPlayer(){
  var p=P.p,c=CATS[p.cat],bars='';
  var r=rng(11);for(var i=0;i<34;i++){var hh=10+Math.round(Math.abs(Math.sin(i*.55)+r()*.7)*12);bars+='<i class="bar" style="--h:'+hh+'px;--d:'+(-r()*0.9).toFixed(2)+'s"></i>';}
  var dirCls=LANGS[S.ui].dir==='rtl'?'rtl':'ltr';
  var prevI=dirCls==='rtl'?'next':'prev',nextI=dirCls==='rtl'?'prev':'next';
  var o='<div class="pl-scene">'+scene(p.scene,{h:250})+'<button class="x" data-act="close-player" aria-label="'+t('closeLabel')+'">'+ic('down')+'</button><span class="ai-badge">'+ic('spark')+t('aiBadgeLabel')+'</span></div>';
  o+='<div class="pl-body"><div class="pl-meta"><span class="pill" style="background:'+c.color+'">'+cn(p.cat)+'</span><span class="pill mut">'+distTxt(p)+'</span></div>';
  o+='<h2>'+pn(p)+'</h2><div class="tagline">'+psub(p)+'</div><div class="wave" aria-hidden="true">'+bars+'</div>';
  o+='<div class="lines" id="lines">'+linesHTML()+'</div>';
  o+='<div class="prog"><div class="track"><i id="pfill"></i></div><div class="times"><span id="tcur">'+fmt(0)+'</span><span id="ttot">'+fmt(totalDur(p,S.ui))+'</span></div></div>';
  o+='<div class="ctl"><button class="cb t" data-act="speed" id="spd">'+nf(P.rate)+'×</button><button class="cb" data-act="prev" aria-label="'+t('prevLabel')+'">'+ic(prevI)+'</button><button class="cb main" id="pp" data-act="toggle" aria-label="'+t('playLabel')+'">'+ic('play')+'</button><button class="cb" data-act="next" aria-label="'+t('nextLabel')+'">'+ic(nextI)+'</button><span class="cb" aria-hidden="true"></span></div>';
  o+='<div class="hint" id="hint"></div></div>';
  o+='<div class="done-card" id="done"></div>';
  $('#player').innerHTML=o;
}
function linesHTML(){
  var dirCls=LANGS[S.ui].dir==='rtl'?'rtl':'ltr';
  return narrLines(P.p).map(function(txt,i){
    var words=txt.split(' ').map(function(w){return '<span class="w">'+w+'</span>';}).join(' ');
    return '<p class="ln '+dirCls+'" data-i="'+i+'">'+words+'</p>';
  }).join('');
}
function speakLine(text,my,fin){
  var v=P.voice;
  if(!('speechSynthesis' in window)||!v)return false;
  try{
    var u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=Math.min(1.6,P.rate*0.95);
    var spoke=false;
    u.onstart=function(){spoke=true;};
    u.onend=fin;u.onerror=function(){if(P.tok===my&&!spoke)return;fin();};
    window.speechSynthesis.speak(u);
    P.timers.push(setTimeout(function(){if(P.tok===my&&!spoke){try{window.speechSynthesis.cancel();}catch(e){}P.real=false;setHint();P.timers.push(setTimeout(fin,estDur(text,S.ui)*1000));}},1400));
    P.timers.push(setTimeout(fin,estDur(text,S.ui)*1000*2.6+4000));
    return true;
  }catch(e){return false;}
}
function setHint(){
  var h=$('#hint');if(!h)return;
  if(P.real){h.textContent='';return;}
  h.textContent=P.playing?t('hintNoVoice'):'';
}
function playLine(i){
  var l=narrLines(P.p);
  if(i>=l.length){finish();return;}
  clearTimers();
  var my=++P.tok;P.idx=i;P.lineStart=performance.now();
  P.durs=l.map(function(txt){return estDur(txt,S.ui);});
  $$('#lines .ln').forEach(function(e,k){e.classList.toggle('on',k===i);e.classList.toggle('done',k<i);$$('.w',e).forEach(function(w){w.classList.remove('k');});});
  var cur=$('#lines .ln[data-i="'+i+'"]');
  if(cur){var box=$('#lines');try{box.scrollTo({top:Math.max(0,cur.offsetTop-box.clientHeight*.3),behavior:'smooth'});}catch(e){box.scrollTop=Math.max(0,cur.offsetTop-box.clientHeight*.3);}}
  var done=false,fin=function(){if(done||P.tok!==my||!P.playing)return;done=true;playLine(i+1);};
  P.real=speakLine(l[i],my,fin);
  if(!P.real)P.timers.push(setTimeout(fin,P.durs[i]*1000));
  setHint();
}
function startPlay(){
  if(!P.p)return;
  P.playing=true;$('#player').classList.add('playing');
  var pp=$('#pp');if(pp){pp.innerHTML=ic('pause');pp.setAttribute('aria-label',t('pauseLabel'));}
  playLine(P.idx);
  cancelAnimationFrame(P.raf);tick();
}
function pausePlay(){
  P.playing=false;P.tok++;clearTimers();
  var pl=$('#player');if(pl)pl.classList.remove('playing');
  var pp=$('#pp');if(pp){pp.innerHTML=ic('play');pp.setAttribute('aria-label',t('playLabel'));}
  setHint();
}
function tick(){
  if(!P.playing)return;
  var i=P.idx,el=(performance.now()-P.lineStart)/1000,d=P.durs[i]||1,f=Math.min(1,el/d);
  var before=0;for(var k=0;k<i;k++)before+=P.durs[k];
  var total=P.durs.reduce(function(a,b){return a+b;},0),cur=before+Math.min(el,d);
  var fill=$('#pfill');if(fill)fill.style.width=Math.min(100,cur/total*100)+'%';
  var tc=$('#tcur');if(tc)tc.textContent=fmt(cur);
  var ws=$$('#lines .ln.on .w'),n=Math.floor(f*ws.length*1.06);
  ws.forEach(function(w,k){w.classList.toggle('k',k<n);});
  P.raf=requestAnimationFrame(tick);
}
function finish(){
  pausePlay();
  var fresh=!S.heard[P.p.id];S.heard[P.p.id]=1;saveHeard();
  var fill=$('#pfill');if(fill)fill.style.width='100%';
  $$('#lines .ln').forEach(function(e){e.classList.remove('on');e.classList.add('done');});
  var next=STORY.filter(function(p){return !S.heard[p.id];})[0];
  var d=$('#done');
  d.innerHTML=fpSVG('',groupsNow())+'<div><b>'+(fresh?t('doneNewLines'):t('doneAlreadyHeard'))+'</b><span>'+nf(heardCount())+'/'+nf(STORY.length)+'</span><button class="btn" data-act="goto-print">'+t('seeMyPrint')+'</button>'+(next?'<button class="btn" data-act="close-player">'+t('continueTour')+'</button>':'')+'</div>';
  d.classList.add('on');
}
function closePlayer(){
  pausePlay();cancelAnimationFrame(P.raf);
  $('#player').classList.remove('on');
  if(S.tab==='map'||S.tab==='home'||S.tab==='print')renderTab(S.tab);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'tab':go(v);break;
    case 'open':openSheet(v);break;
    case 'openex':openExSheet(v);break;
    case 'play':openPlayer(v);break;
    case 'close-sheet':closeSheet();break;
    case 'close-player':closePlayer();break;
    case 'cat':S.filter=v;S.q='';go('explore');break;
    case 'filter':S.filter=v;renderTab('explore');break;
    case 'about':openAbout();break;
    case 'lang':openLangSheet();break;
    case 'setlang':applyUI(v);closeSheet();break;
    case 'show-map':closeSheet();go('map');break;
    case 'enable-geo':startGeo();break;
    case 'toggle':P.playing?pausePlay():startPlay();break;
    case 'next':
    case 'prev':
      if(P.p){var was=P.playing,d=(a==='next')?1:-1;P.idx=Math.max(0,Math.min(narrLines(P.p).length-1,P.idx+d));P.playing=true;playLine(P.idx);
        if(!was){$('#player').classList.add('playing');$('#pp').innerHTML=ic('pause');tick();}}
      break;
    case 'speed':P.rate=P.rate===1?1.25:(P.rate===1.25?0.85:1);$('#spd').textContent=nf(P.rate)+'×';if(P.playing)playLine(P.idx);$('#ttot').textContent=fmt(totalDur(P.p,S.ui));break;
    case 'goto-print':closePlayer();go('print');break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('#player').classList.contains('on'))closePlayer();else closeSheet();}});

/* ---------- boot ---------- */
(function boot(){
  var app=$('#app');app.setAttribute('dir',LANGS[S.ui].dir);app.setAttribute('lang',S.ui);
  document.documentElement.setAttribute('lang',S.ui);document.documentElement.setAttribute('dir',LANGS[S.ui].dir);
  renderTabbar();
  renderTab('home');renderTab('map');renderTab('explore');renderTab('print');
  $('#p-home').classList.add('on');
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
})();
})();

</script>
